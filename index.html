<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>azlinks</title>
    <!-- Favicon Moderno -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%232563eb'/><path d='M30 50l20-20v15h20v10H50v15z' fill='%23ffffff'/><circle cx='70' cy='70' r='8' fill='%2360a5fa'/></svg>">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="azlinks-192x192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Segoe UI"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #f3f3f3; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cdcdcd; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a6a6a6; }

        button, [onclick] {
            touch-action: manipulation;
            cursor: pointer;
        }

        .category-scroll {
            max-height: calc(100dvh - 70px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .safe-bottom-padding {
            padding-bottom: calc(env(safe-area-inset-bottom) + 6rem) !important;
        }

        footer {
            padding-bottom: max(0.625rem, env(safe-area-inset-bottom));
        }

        @media (min-width: 768px) {
            .desktop-logo-text { font-size: 32px !important; }
            .desktop-logo-svg { width: 190px !important; height: 46px !important; }
            .category-scroll { max-height: calc(100vh - 100px); }
            .safe-bottom-padding { padding-bottom: 2rem !important; }
            
            #sidebar:not(:hover):not(.sidebar-expanded) .sidebar-text {
                display: none !important;
            }

            #sidebar:not(:hover):not(.sidebar-expanded) .category-scroll {
                scrollbar-width: none;
                -ms-overflow-style: none;
            }
            #sidebar:not(:hover):not(.sidebar-expanded) .category-scroll::-webkit-scrollbar {
                display: none;
            }
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] min-h-[100dvh] font-sans overflow-hidden text-slate-800">

    <!-- Barra Superior -->
    <header class="bg-white/90 backdrop-blur-md border-b border-gray-200 p-3 flex flex-col items-start md:items-stretch gap-3 shadow-sm z-20 shrink-0">
        <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-2">
                <div class="flex items-center cursor-pointer select-none shrink-0 self-center" onclick="window.location.reload()">
                    <svg class="desktop-logo-svg" width="140" height="34" viewBox="0 0 180 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g onclick="event.stopPropagation(); window.open('https://azlinks.com.br/cadusu.html', '_blank');" style="cursor:pointer" role="button" aria-label="Abrir gerenciador"><title>Abrir gerenciador</title><rect width="40" height="40" rx="10" fill="#2563EB"/>
                        <path d="M12 28L20 14L28 28H23.5L20 21.5L16.5 28H12Z" fill="white"/>
                        <path d="M15 25H25" stroke="white" stroke-width="2"/></g>
                        <text class="desktop-logo-text" x="48" y="28" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="22" fill="#1E293B">AZ<tspan fill="#2563EB">Links</tspan></text>
                    </svg>
                </div>
            </div>

            <!-- Botões Desktop -->
            <div class="hidden md:flex items-center justify-end w-full gap-2">
                <button type="button" onclick="openModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-md text-sm font-medium shadow-sm transition-all cursor-pointer">
                    <i class="fa-solid fa-plus pointer-events-none"></i> <span class="pointer-events-none">Novo</span>
                </button>

                <!-- Botão de Ordenação Desktop -->
                <button type="button" onclick="toggleSortOrder()" title="Ordenar A-Z / Z-A" id="btnSortDesk" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:bg-gray-200 transition-all flex items-center justify-center cursor-pointer">
                    <i id="sortIconDesk" class="fa-solid fa-arrow-down-a-z pointer-events-none"></i>
                </button>

                <div class="flex items-center bg-gray-100 border border-gray-200 rounded p-0.5 gap-0.5">
                    <button type="button" onclick="setViewMode('grid')" title="Visualização em Grade" id="btnGridDesk" class="p-1.5 text-xs rounded text-gray-700 hover:bg-white transition-all cursor-pointer">
                        <i class="fa-solid fa-border-all"></i>
                    </button>
                    <button type="button" onclick="setViewMode('list')" title="Visualização em Lista" id="btnListDesk" class="p-1.5 text-xs rounded text-gray-700 hover:bg-white transition-all cursor-pointer">
                        <i class="fa-solid fa-list"></i>
                    </button>
                </div>

                <button type="button" data-size-btn onclick="toggleSizeMenu(event)" title="Tamanho da visualização" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:bg-gray-200 hover:text-blue-600 transition-all flex items-center justify-center shrink-0 cursor-pointer"><i class="fa-solid fa-maximize pointer-events-none"></i></button>
                
                <!-- Botão de Sincronização Desktop -->
                <button type="button" onclick="syncFromGoogleSheets()" title="Sincronizar com o Google Sheets" id="syncBtnDesk" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:bg-gray-200 hover:text-blue-600 transition-all flex items-center justify-center cursor-pointer shrink-0">
                    <i id="syncIconDesk" class="fa-solid fa-rotate-right pointer-events-none"></i>
                </button>
            </div>
        </div>

        <!-- Linha de Pesquisa e Botões Mobile -->
        <div class="flex items-center justify-between w-full gap-2">
            <div class="hidden md:flex items-center gap-2 flex-1">
                <div class="relative w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInputDesktop" placeholder="Pesquisar atalhos..." 
                           class="w-full pl-9 pr-8 py-1.5 bg-gray-50 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all search-input">
                    <button type="button" onclick="clearSearch()" class="clear-search-btn absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden text-sm"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <!-- Botões Mobile -->
            <div class="flex md:hidden items-center justify-between w-full overflow-x-auto pb-1 gap-2">
                <button type="button" onclick="openModal()" class="flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-md text-xs font-medium shrink-0 cursor-pointer"><i class="fa-solid fa-plus pointer-events-none"></i> <span class="pointer-events-none">Novo</span></button>
                
                <div class="flex items-center gap-1.5 shrink-0">
                    <button type="button" onclick="toggleSortOrder()" title="Ordenar A-Z / Z-A" id="btnSortMob" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:bg-gray-200 transition-all flex items-center justify-center shrink-0 cursor-pointer">
                        <i id="sortIconMob" class="fa-solid fa-arrow-down-a-z pointer-events-none"></i>
                    </button>

                    <div class="flex items-center bg-gray-100 border border-gray-200 rounded p-0.5 gap-0.5 shrink-0">
                        <button type="button" onclick="setViewMode('grid')" title="Grade" id="btnGridMob" class="p-1.5 text-xs rounded text-gray-700 hover:bg-white transition-all cursor-pointer">
                            <i class="fa-solid fa-border-all"></i>
                        </button>
                        <button type="button" onclick="setViewMode('list')" title="Lista" id="btnListMob" class="p-1.5 text-xs rounded text-gray-700 hover:bg-white transition-all cursor-pointer">
                            <i class="fa-solid fa-list"></i>
                        </button>
                    </div>

                    <button type="button" data-size-btn onclick="toggleSizeMenu(event)" title="Tamanho da visualização" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:bg-gray-200 hover:text-blue-600 transition-all flex items-center justify-center shrink-0 cursor-pointer"><i class="fa-solid fa-maximize pointer-events-none"></i></button>
                    
                    <button type="button" onclick="syncFromGoogleSheets()" title="Sincronizar com o Google Sheets" id="syncBtnMob" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:text-blue-600 transition-all flex items-center justify-center cursor-pointer shrink-0">
                        <i id="syncIconMob" class="fa-solid fa-rotate-right pointer-events-none"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Pesquisa Mobile -->
        <div class="flex md:hidden items-center gap-2 w-full">
            <button type="button" onclick="toggleMobileSidebar()" title="Menu" class="p-2 text-gray-600 hover:text-blue-600 focus:outline-none rounded-md hover:bg-gray-100 transition-colors shrink-0 cursor-pointer">
                <i class="fa-solid fa-bars text-lg pointer-events-none"></i>
            </button>
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="searchInputMobile" placeholder="Pesquisar atalhos..." 
                       class="w-full pl-9 pr-8 py-1.5 bg-gray-50 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all search-input">
                <button type="button" onclick="clearSearch()" class="clear-search-btn absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- Cabeçalho Categoria -->
        <div class="flex items-center justify-between bg-white px-4 py-2 rounded-lg border border-gray-200/80 shadow-sm w-full">
            <div class="flex flex-col gap-1 min-w-0 flex-1">
                <div class="flex items-center gap-2 min-w-0">
                    <h2 id="currentCategoryTitle" class="font-semibold text-gray-800 text-xs md:text-base flex items-center gap-2 truncate">
                        <i class="fa-solid fa-folder-open text-blue-600"></i> Todos os Atalhos
                    </h2>
                </div>
                <!-- Linha da Subcategoria / Sub-subcategoria -->
                <div id="currentSubcategoryRow" class="hidden flex items-center gap-1.5 min-w-0 pt-1 border-t border-gray-100 flex-wrap">
                    <button type="button" onclick="exitSubcategory()" title="Voltar um nível" class="p-1 text-blue-600 hover:bg-blue-50 rounded transition-colors shrink-0 cursor-pointer">
                        <i class="fa-solid fa-arrow-left pointer-events-none text-xs"></i>
                    </button>
                    <button type="button" id="currentSubcategoryBtn" onclick="goToLevel1Subcategory()" class="text-blue-600 hover:underline font-semibold text-xs flex items-center gap-1.5 truncate cursor-pointer">
                        <span id="currentSubcategoryIconContainer"><i class="fa-solid fa-folder text-amber-400"></i></span> <span id="currentSubcategoryText" class="truncate"></span>
                    </button>
                    <span id="currentSubsubSeparator" class="hidden text-gray-400 text-xs">/</span>
                    <span id="currentSubsubcategoryBadge" class="hidden text-blue-700 font-semibold text-xs flex items-center gap-1.5 truncate">
                        <span id="currentSubsubIconContainer"><i class="fa-solid fa-folder-open text-amber-500"></i></span> <span id="currentSubsubcategoryText" class="truncate"></span>
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-2 shrink-0 pl-2">
                <span id="currentCategoryCount" class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-0.5 rounded-full shrink-0">0 itens</span>
                
                <div id="categoryHeaderMoreContainer" class="relative dropdown-container shrink-0 hidden">
                    <button type="button" id="btnHeaderMore" title="Mais opções" class="p-1.5 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:text-blue-600 transition-all flex items-center justify-center cursor-pointer">
                        <i class="fa-solid fa-ellipsis-vertical pointer-events-none"></i>
                    </button>
                    <div id="headerMoreDropdown" class="absolute right-0 mt-1 w-48 bg-white border border-gray-200 rounded-md shadow-lg hidden z-30 py-1 text-xs">
                        <div id="headerMenuAllOptions">
                            <button type="button" onclick="exportBackup(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-gray-700 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-download text-gray-400"></i> Exportar</button>
                            <button type="button" onclick="triggerImportBackup(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-gray-700 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-upload text-gray-400"></i> Importar</button>
                            <button type="button" onclick="confirmClearAllShortcuts(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-red-600 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-trash text-red-500"></i> Remover Todos</button>
                        </div>
                        <div id="headerMenuCategoryOptions" class="hidden">
                            <button type="button" onclick="openAddSubcategoryModal(currentCategory, '', currentSubcategory || ''); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-gray-700 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-folder-plus text-blue-600"></i> Subcategoria</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Aviso de Sem Conexão -->
    <div id="offlineBanner" class="hidden bg-red-600 text-white text-xs font-semibold px-4 py-2 text-center flex items-center justify-center gap-2 shrink-0 z-30 shadow-md">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Sem conexão com a internet. Os atalhos estão ocultos até que a conexão seja restabelecida.</span>
    </div>

    <div class="flex-1 flex overflow-hidden relative">
        <aside id="sidebar" 
               class="fixed inset-y-0 left-0 -translate-x-full md:translate-x-0 md:relative bg-gray-50/95 backdrop-blur-md border-r border-gray-200 p-3 flex flex-col justify-between transition-all duration-300 w-64 md:w-20 hover:md:w-64 group z-40 md:z-30 shadow-lg md:shadow-none max-h-[100dvh] overflow-y-auto md:overflow-visible group-hover:md:overflow-y-auto">
            <div class="flex flex-col gap-1 w-full category-scroll pb-16 md:pb-0">
                <div class="flex items-center justify-between mb-3 px-3 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-blue-500 shadow-md md:hidden">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <span class="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center shrink-0"><i class="fa-solid fa-sliders text-white text-sm"></i></span>
                        <div id="sidebarTitle" class="text-sm font-bold text-white uppercase tracking-widest truncate">CATEGORIAS</div>
                    </div>
                    <button type="button" onclick="toggleMobileSidebar()" title="Fechar" class="md:hidden w-8 h-8 flex items-center justify-center rounded-full text-white/90 hover:bg-white/20 transition-colors shrink-0"><i class="fa-solid fa-xmark text-base"></i></button>
                </div>
                <div id="categoryList" class="flex flex-col gap-1 mt-1"></div>
            </div>
        </aside>

        <div id="sidebarOverlay" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-black/40 z-30 hidden md:hidden"></div>

        <main class="flex-1 flex flex-col p-3 md:p-4 overflow-y-auto safe-bottom-padding gap-4">
            <div id="shortcutsGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-7 xl:grid-cols-8 gap-3"></div>
            <div id="shortcutsList" class="hidden flex flex-col bg-white rounded-lg border border-gray-200 shadow-sm overflow-visible"></div>
            
            <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center text-center p-8 text-gray-400">
                <i class="regular fa-folder-open text-5xl mb-3 text-gray-300"></i>
                <p class="text-base font-medium">Nenhum atalho encontrado</p>
            </div>
        </main>
    </div>

    <!-- Rodapé -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-2.5 flex items-center justify-between text-xs text-gray-500 z-40 shadow-md md:relative">
        <div onclick="openEmailModal(true)" title="Trocar de e-mail" class="flex items-center gap-2 truncate cursor-pointer hover:text-blue-600 transition-colors w-full justify-center md:justify-start">
            <i class="fa-solid fa-shield-halved text-blue-600 shrink-0"></i>
            <span class="truncate">Licenciado para: <strong id="footerLicenseName" class="text-gray-700">Sebastião Torquato</strong></span>
        </div>
    </footer>

    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="handleImportBackup(event)">
    <input type="file" id="shortcutIconFileInput" accept="image/*" class="hidden" onchange="handleShortcutIconFileSelect(event)">
    <input type="file" id="categoryIconFileInput" accept="image/*" class="hidden" onchange="handleCategoryIconFileSelect(event)">
    <input type="file" id="subcatIconFileInput" accept="image/*" class="hidden" onchange="handleSubcatIconFileSelect(event)">

    <!-- Modais de Licença, Login, Atalhos, Subcategorias, etc... -->
    <!-- (Mantidos completos conforme original) -->
    
    <div id="licenseBlock" class="fixed inset-0 bg-white z-[70] hidden flex items-center justify-center p-6">
        <div class="w-full max-w-md border-2 border-red-500 rounded-lg p-6 flex flex-col items-center text-center gap-4">
            <i class="fa-solid fa-lock text-red-500 text-4xl"></i>
            <p id="licenseBlockMessage" class="text-red-600 font-semibold text-lg leading-snug"></p>
            <button type="button" onclick="useAnotherEmail()" class="mt-2 px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium">Entrar com outro e-mail</button>
        </div>
    </div>

    <div id="emailModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden border border-gray-100">
            <div class="bg-gray-50 px-5 py-3 border-b border-gray-200">
                <h3 class="font-semibold text-gray-800 text-sm flex items-center gap-2"><i class="fa-solid fa-envelope text-blue-600"></i> Acessar com e-mail</h3>
            </div>
            <form onsubmit="handleEmailSubmit(event)" class="p-5 flex flex-col gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">E-mail cadastrado *</label>
                    <input type="email" id="loginEmail" required autocomplete="email" autocapitalize="none" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div id="loginPasswordContainer">
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Senha *</label>
                    <input type="password" id="loginPassword" required maxlength="8" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <p id="loginEmailError" class="hidden text-xs text-red-600 mt-0.5"></p>
                <div class="flex items-center justify-end gap-2 mt-2 pt-3 border-t">
                    <button type="button" id="emailCancelBtn" onclick="closeEmailModal()" class="hidden px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-md">Cancelar</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium">Entrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modais de Atalho, Subcategoria e Exclusão -->
    <div id="shortcutModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
            <div class="bg-gray-50 px-5 py-3 border-b border-gray-200 flex items-center justify-between">
                <h3 class="font-semibold text-gray-800 text-sm flex items-center gap-2"><i class="fa-solid fa-file-code text-blue-600"></i> Adicionar Atalho</h3>
                <button type="button" onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleFormSubmit(event)" class="p-5 flex flex-col gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Título do Atalho *</label>
                    <div class="relative"><input type="text" id="shortcutTitle" required class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none pr-9"><button type="button" tabindex="-1" onclick="clearField('shortcutTitle')" title="Limpar" class="clear-field-btn absolute right-2 top-1/2 -translate-y-1/2 w-6 h-6 flex items-center justify-center text-gray-400 hover:text-red-500 rounded-full cursor-pointer"><i class="fa-solid fa-xmark pointer-events-none"></i></button></div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Link ou URL *</label>
                    <div class="relative"><input type="text" id="fileName" required autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none pr-9"><button type="button" tabindex="-1" onclick="clearField('fileName')" title="Limpar" class="clear-field-btn absolute right-2 top-1/2 -translate-y-1/2 w-6 h-6 flex items-center justify-center text-gray-400 hover:text-red-500 rounded-full cursor-pointer"><i class="fa-solid fa-xmark pointer-events-none"></i></button></div>
                </div>
                <div id="shortcutCategoryWrapper">
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Categoria *</label>
                    <div class="relative">
                        <input type="text" id="shortcutCategory" required autocomplete="off" role="combobox" aria-autocomplete="list" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none pr-16">
                        <button type="button" tabindex="-1" onclick="clearField('shortcutCategory')" title="Limpar" class="clear-field-btn absolute right-8 top-1/2 -translate-y-1/2 w-6 h-6 flex items-center justify-center text-gray-400 hover:text-red-500 rounded-full cursor-pointer"><i class="fa-solid fa-xmark pointer-events-none"></i></button>
                        <button type="button" tabindex="-1" onmousedown="event.preventDefault()" onclick="toggleCategoryCombo('shortcutCategory')" title="Ver categorias" class="absolute right-2 top-1/2 -translate-y-1/2 w-6 h-6 flex items-center justify-center text-gray-400 hover:text-blue-600 rounded-full cursor-pointer"><i class="fa-solid fa-chevron-down text-xs pointer-events-none"></i></button>
                    </div>
                </div>

                <div class="flex flex-wrap items-center gap-4 py-1.5 border-t border-b border-gray-100 my-1">
                    <div class="flex items-center gap-1.5">

    </div>

    <!-- Outros modais necessários omitidos para brevidade mas inclusos no projeto -->
    <div id="subcategoryModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"></div>
    <div id="editSubcatIconModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"></div>
    <div id="moveSubcategoryModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"></div>
    <div id="editShortcutModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"></div>
    <div id="editCategoryModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"></div>
    <div id="editCategoryIconModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"></div>
    <div id="deleteModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"></div>

    <script>
        let APPS_SCRIPT_URL = '';
        let APPS_SCRIPT_PLANILHA = '';
        const APPS_SCRIPT_URL_PLACEHOLDER = 'SUA_URL_DO_APPS_SCRIPT_AQUI';
        const APPS_SCRIPT_CENTRAL_URL = 'https://script.google.com/macros/s/AKfycbyNRHauds83by09v_Dq5wYROW87ycWqqf1mn48VeRi7MXCHyh0g4v6VtnEULq8_jpA/exec';

        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        function isSyncConfigured() {
            return !!APPS_SCRIPT_URL && APPS_SCRIPT_URL !== APPS_SCRIPT_URL_PLACEHOLDER;
        }

        function normalizeUrl(value) {
            const v = String(value || '').trim();
            if (!v) return '';
            return /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v) ? v : 'https://' + v;
        }

        function cleanUrlInput(value) {
            if (!value) return '';
            return String(value).trim().replace(/\s+/g, '');
        }

        function getFaviconUrl(targetUrl) {
            try {
                return `https://www.google.com/s2/favicons?domain=${new URL(targetUrl).hostname}&sz=128`;
            } catch (err) {
                return 'https://via.placeholder.com/32';
            }
        }

        function generateUniqueId() {
            return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function escapeJsStr(str) {
            return String(str || '').replace(/\\/g, '\\').replace(/'/g, "\\'");
        }

        let htmlFiles = [];
        let categoryCustomizations = {};
        let currentCategory = 'all';
        let currentSubcategory = null;
        let currentSubsubcategory = null;
        let searchQuery = '';
        let categoryViewModes = JSON.parse(localStorage.getItem('local_category_view_modes')) || {};
        let categorySortOrders = JSON.parse(localStorage.getItem('local_category_sort_orders')) || {};
        let categoryIconSizes = JSON.parse(localStorage.getItem('local_category_icon_sizes')) || {};
        let sidebarOpen = false;
        let itemToDeleteId = null;
        let editingShortcutIconId = null;
        let editingSubcatInfo = null;
        let isSyncing = false;
        let syncInterval = null;

        const availableCategoryIcons = [
            { icon: 'fa-solid fa-house', color: 'text-amber-500' },
            { icon: 'fa-solid fa-cart-shopping', color: 'text-emerald-500' },
            { icon: 'fa-solid fa-brain', color: 'text-purple-500' },
            { icon: 'fa-solid fa-newspaper', color: 'text-blue-500' },
            { icon: 'fa-solid fa-video', color: 'text-red-500' },
            { icon: 'fa-solid fa-briefcase', color: 'text-indigo-500' },
            { icon: 'fa-solid fa-wrench', color: 'text-cyan-600' },
            { icon: 'fa-solid fa-users', color: 'text-pink-500' },
            { icon: 'fa-solid fa-star', color: 'text-amber-400' },
            { icon: 'fa-solid fa-code', color: 'text-teal-600' }
        ];

        const categoryKeywordMap = {
            'loja': 1, 'lojas': 1, 'compras': 1,
            'ia': 2, 'ai': 2, 'inteligência': 2,
            'noticia': 3, 'notícias': 3, 'news': 3,
            'canal': 4, 'canais': 4, 'video': 4, 'youtube': 4,
            'trabalho': 5, 'work': 5,
            'ferramenta': 6, 'ferramentas': 6,
            'social': 7, 'redes': 7,
            'favorito': 8, 'favoritos': 8,
            'dev': 9, 'programação': 9
        };

        function getCategoryIcon(catName) {
            if (!catName) return 'fa-solid fa-folder text-blue-500';
            if (catName === 'most_visited') return 'fa-solid fa-fire text-amber-500';
            if (catName === 'favorites') return 'fa-solid fa-star text-amber-400';

            if (categoryCustomizations[catName] && categoryCustomizations[catName].icon) {
                return categoryCustomizations[catName].icon;
            }

            const name = catName.trim().toLowerCase();
            if (name === 'todos') return 'fa-solid fa-border-all text-blue-600';
            
            for (let keyword in categoryKeywordMap) {
                if (name.includes(keyword)) {
                    const item = availableCategoryIcons[categoryKeywordMap[keyword]];
                    return `${item.icon} ${item.color}`;
                }
            }
            return 'fa-solid fa-folder text-blue-500';
        }

        function getSubcategoryCustom(catName, subName) {
            if (!catName || !subName) return null;
            const custom = categoryCustomizations[catName];
            if (custom && custom.subcatCustom && typeof custom.subcatCustom === 'object') {
                const target = subName.trim().toLowerCase();
                const foundKey = Object.keys(custom.subcatCustom).find(k => k.trim().toLowerCase() === target);
                if (foundKey) return custom.subcatCustom[foundKey];
            }
            return null;
        }

        let pendingSyncCount = 0;

        function beginSync() {
            pendingSyncCount++;
            const iconDesk = document.getElementById('syncIconDesk');
            const iconMob = document.getElementById('syncIconMob');
            const btnDesk = document.getElementById('syncBtnDesk');
            const btnMob = document.getElementById('syncBtnMob');

            if (iconDesk) iconDesk.className = 'fa-solid fa-rotate-right fa-spin pointer-events-none text-amber-600';
            if (iconMob) iconMob.className = 'fa-solid fa-rotate-right fa-spin pointer-events-none text-amber-600';
            if (btnDesk) btnDesk.classList.add('bg-amber-50', 'border-amber-200');
            if (btnMob) btnMob.classList.add('bg-amber-50', 'border-amber-200');
        }

        function endSync() {
            pendingSyncCount = Math.max(0, pendingSyncCount - 1);
            if (pendingSyncCount === 0) {
                const iconDesk = document.getElementById('syncIconDesk');
                const iconMob = document.getElementById('syncIconMob');
                const btnDesk = document.getElementById('syncBtnDesk');
                const btnMob = document.getElementById('syncBtnMob');

                if (iconDesk) iconDesk.className = 'fa-solid fa-rotate-right pointer-events-none text-gray-700';
                if (iconMob) iconMob.className = 'fa-solid fa-rotate-right pointer-events-none text-gray-700';
                if (btnDesk) btnDesk.classList.remove('bg-amber-50', 'border-amber-200');
                if (btnMob) btnMob.classList.remove('bg-amber-50', 'border-amber-200');
            }
        }

        function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            return fetch(url, { ...options, signal: controller.signal })
                .finally(() => clearTimeout(timer));
        }

        const LOCAL_DB_NAME = 'azlinks_db';
        const LOCAL_DB_STORE = 'kv';
        let localDbPromise = null;
        let pendingPush = false;
        let localVersion = 0;

        function openLocalDB() {
            if (localDbPromise) return localDbPromise;
            localDbPromise = new Promise((resolve, reject) => {
                if (!window.indexedDB) return reject(new Error('IndexedDB indisponível'));
                const req = indexedDB.open(LOCAL_DB_NAME, 1);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(LOCAL_DB_STORE)) {
                        db.createObjectStore(LOCAL_DB_STORE);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            return localDbPromise;
        }

        async function idbGet(key) {
            try {
                const db = await openLocalDB();
                return await new Promise((resolve, reject) => {
                    const q = db.transaction(LOCAL_DB_STORE, 'readonly').objectStore(LOCAL_DB_STORE).get(key);
                    q.onsuccess = () => resolve(q.result);
                    q.onerror = () => reject(q.error);
                });
            } catch (err) {
                const v = localStorage.getItem('idbfb_' + key);
                return v === null ? undefined : v;
            }
        }

        async function idbSetMany(obj) {
            try {
                const db = await openLocalDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(LOCAL_DB_STORE, 'readwrite');
                    const store = tx.objectStore(LOCAL_DB_STORE);
                    Object.keys(obj).forEach(k => store.put(obj[k], k));
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                    tx.onabort = () => reject(tx.error);
                });
            } catch (err) {
                try { Object.keys(obj).forEach(k => localStorage.setItem('idbfb_' + k, obj[k])); } catch (e) {}
            }
        }

        async function loadLocalData() {
            const [s, c, d] = await Promise.all([idbGet('shortcuts'), idbGet('categories'), idbGet('dirty')]);
            try {
                if (s !== undefined && s !== null) {
                    htmlFiles = (JSON.parse(s) || []).map(item => ({
                        ...item,
                        showDesktop: item.showDesktop !== false,
                        showMobile: item.showMobile !== false,
                        subcategory: item.subcategory || '',
                        subsubcategory: item.subsubcategory || ''
                    }));
                    categoryCustomizations = JSON.parse(c || '{}') || {};
                    pendingPush = d === 'true';
                    return;
                }
                htmlFiles = (JSON.parse(localStorage.getItem('local_html_shortcuts')) || []).map(item => ({
                    ...item,
                    showDesktop: item.showDesktop !== false,
                    showMobile: item.showMobile !== false,
                    subcategory: item.subcategory || '',
                    subsubcategory: item.subsubcategory || ''
                }));
                categoryCustomizations = JSON.parse(localStorage.getItem('local_category_customizations')) || {};
                await idbSetMany({
                    shortcuts: JSON.stringify(htmlFiles),
                    categories: JSON.stringify(categoryCustomizations),
                    dirty: 'false'
                });
            } catch (err) {
                htmlFiles = [];
                categoryCustomizations = {};
            }
        }

        async function syncToGoogleSheets() {
            if (!isSyncConfigured() || isSyncing || !navigator.onLine) return;
            isSyncing = true;
            beginSync();
            const versionAtStart = localVersion;
            try {
                await fetchWithTimeout(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        shortcuts: htmlFiles, 
                        categories: categoryCustomizations, 
                        planilha: APPS_SCRIPT_PLANILHA 
                    })
                });
                if (versionAtStart === localVersion) {
                    pendingPush = false;
                    await idbSetMany({ dirty: 'false' });
                }
            } catch (err) {
                console.error("Erro ao sincronizar envio:", err);
            } finally {
                isSyncing = false;
                endSync();
                if (pendingPush && versionAtStart !== localVersion) setTimeout(syncToGoogleSheets, 0);
            }
        }

        async function syncFromGoogleSheets() {
            if (!isSyncConfigured() || !navigator.onLine) return;
            if (pendingPush) {
                await syncToGoogleSheets();
                if (pendingPush) return;
            }
            if (isSyncing) return;
            const versionAtStart = localVersion;

            isSyncing = true;
            beginSync();

            try {
                const timestamp = Date.now();
                let getUrl = APPS_SCRIPT_URL;
                if (APPS_SCRIPT_PLANILHA) {
                    getUrl += (getUrl.includes('?') ? '&' : '?') + 'planilha=' + encodeURIComponent(APPS_SCRIPT_PLANILHA) + '&_t=' + timestamp;
                } else {
                    getUrl += (getUrl.includes('?') ? '&' : '?') + '_t=' + timestamp;
                }

                const res = await fetchWithTimeout(getUrl);
                const data = await res.json();
                
                if (data.status === "success" && !pendingPush && versionAtStart === localVersion) {
                    let changed = false;
                    
                    if (Array.isArray(data.shortcuts)) {
                        const parsedRemoteShortcuts = data.shortcuts.map(s => ({
                            ...s,
                            showDesktop: s.showDesktop !== false,
                            showMobile: s.showMobile !== false,
                            subcategory: s.subcategory || '',
                            subsubcategory: s.subsubcategory || ''
                        }));

                        const shortcutMap = new Map();
                        htmlFiles.forEach(localItem => shortcutMap.set(localItem.id, { ...localItem }));
                        
                        parsedRemoteShortcuts.forEach(remoteItem => {
                            if (shortcutMap.has(remoteItem.id)) {
                                const localItem = shortcutMap.get(remoteItem.id);
                                shortcutMap.set(remoteItem.id, {
                                    ...remoteItem,
                                    customIcon: localItem.customIcon || remoteItem.customIcon || '',
                                    visitCount: Math.max(localItem.visitCount || 0, remoteItem.visitCount || 0),
                                    isFavorite: localItem.isFavorite || remoteItem.isFavorite
                                });
                            } else {
                                shortcutMap.set(remoteItem.id, remoteItem);
                            }
                        });

                        const mergedShortcuts = Array.from(shortcutMap.values());
                        const newShortcutsStr = JSON.stringify(mergedShortcuts);
                        if (newShortcutsStr !== JSON.stringify(htmlFiles)) {
                            htmlFiles = mergedShortcuts;
                            await idbSetMany({ shortcuts: JSON.stringify(htmlFiles) });
                            changed = true;
                        }
                    }

                    if (data.categories && typeof data.categories === 'object') {
                        const mergedCategories = { ...(data.categories || {}) };
                        const newCatStr = JSON.stringify(mergedCategories);
                        if (newCatStr !== JSON.stringify(categoryCustomizations)) {
                            categoryCustomizations = mergedCategories;
                            await idbSetMany({ categories: JSON.stringify(categoryCustomizations) });
                            changed = true;
                        }
                    }

                    if (changed) {
                        render();
                    }
                }
            } catch (err) {
                console.error("Erro ao puxar dados do Sheets:", err);
            } finally {
                isSyncing = false;
                endSync();
            }
        }

        function startAutoSync() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if (!document.hidden && navigator.onLine) {
                    syncFromGoogleSheets();
                }
            }, 10000);
        }

        function saveToStorage(syncNow = true) {
            const snapshot = {
                shortcuts: JSON.stringify(htmlFiles),
                categories: JSON.stringify(categoryCustomizations)
            };
            if (syncNow) {
                localVersion++;
                pendingPush = true;
                snapshot.dirty = 'true';
            }
            idbSetMany(snapshot);
            if (syncNow) {
                syncToGoogleSheets();
            }
        }

        // Eventos de Conexão Online / Offline
        window.addEventListener('online', () => {
            render();
            if (isSyncConfigured()) syncFromGoogleSheets();
        });

        window.addEventListener('offline', () => {
            render();
        });

        function renderGrid() {
            const grid = document.getElementById('shortcutsGrid');
            const list = document.getElementById('shortcutsList');
            const empty = document.getElementById('emptyState');
            const offlineBanner = document.getElementById('offlineBanner');

            // Verifica se há conexão com a internet
            if (!navigator.onLine) {
                if (offlineBanner) offlineBanner.classList.remove('hidden');
                if (grid) grid.classList.add('hidden');
                if (list) list.classList.add('hidden');
                if (empty) {
                    empty.classList.remove('hidden');
                    empty.innerHTML = `
                        <i class="fa-solid fa-wifi text-5xl mb-3 text-red-400"></i>
                        <p class="text-base font-medium text-red-600">Sem conexão com a internet</p>
                        <p class="text-xs text-gray-500 mt-1">Os atalhos de links estão ocultos no modo offline.</p>
                    `;
                }
                document.getElementById('currentCategoryCount').textContent = '0 itens';
                updateCategoryHeader();
                updateViewButtonsStyle();
                updateSortButtonStyle();
                return;
            } else {
                if (offlineBanner) offlineBanner.classList.add('hidden');
                if (empty && empty.querySelector('.fa-wifi')) {
                    empty.innerHTML = `
                        <i class="fa-regular fa-folder-open text-5xl mb-3 text-gray-300"></i>
                        <p class="text-base font-medium">Nenhum atalho encontrado</p>
                    `;
                }
            }

            const viewMode = getViewMode(currentCategory);
            const sortOrder = getSortOrder(currentCategory);

            if (!grid) return;
            updateCategoryHeader();
            updateViewButtonsStyle();
            updateSortButtonStyle();

            const isMob = isMobileDevice();
            const isSystemCat = ['all', 'favorites', 'most_visited'].includes(currentCategory);

            let deviceFiltered = htmlFiles.filter(item => {
                const showDesktop = item.showDesktop !== false;
                const showMobile = item.showMobile !== false;
                return isMob ? showMobile : showDesktop;
            });

            let filtered = [];
            let subcategoriesToShow = [];

            if (searchQuery.length > 0) {
                filtered = deviceFiltered.filter(s => (s.title && s.title.toLowerCase().includes(searchQuery)));
            } else if (isSystemCat) {
                if (currentCategory === 'favorites') filtered = deviceFiltered.filter(s => !!s.isFavorite);
                else if (currentCategory === 'most_visited') filtered = deviceFiltered.filter(s => (s.visitCount || 0) > 0);
                else filtered = deviceFiltered;
            } else {
                const catItems = deviceFiltered.filter(s => (s.category || 'Geral').trim().toLowerCase() === currentCategory.trim().toLowerCase());
                if (currentSubcategory && currentSubsubcategory) {
                    filtered = catItems.filter(s =>
                        (s.subcategory || '').trim().toLowerCase() === currentSubcategory.trim().toLowerCase() &&
                        (s.subsubcategory || '').trim().toLowerCase() === currentSubsubcategory.trim().toLowerCase()
                    );
                } else if (currentSubcategory) {
                    subcategoriesToShow = getSubcategoryChildren(currentCategory, currentSubcategory);
                    filtered = catItems.filter(s =>
                        (s.subcategory || '').trim().toLowerCase() === currentSubcategory.trim().toLowerCase() &&
                        !(s.subsubcategory || '').trim()
                    );
                } else {
                    subcategoriesToShow = getCategorySubcategories(currentCategory);
                    filtered = catItems.filter(s => !(s.subcategory || '').trim());
                }
            }

            const sortByClicks = currentCategory === 'favorites' || currentCategory === 'most_visited';
            filtered.sort((a, b) => {
                if (sortByClicks) {
                    const visitDiff = (b.visitCount || 0) - (a.visitCount || 0);
                    if (visitDiff !== 0) return visitDiff;
                }
                const titleA = (a.title || a.name || '').toLowerCase();
                const titleB = (b.title || b.name || '').toLowerCase();
                const comparison = titleA.localeCompare(titleB);
                return sortOrder === 'asc' ? comparison : -comparison;
            });

            const totalCount = subcategoriesToShow.length + filtered.length;
            document.getElementById('currentCategoryCount').textContent = `${totalCount} ${totalCount === 1 ? 'item' : 'itens'}`;

            if (totalCount === 0) {
                grid.classList.add('hidden');
                list.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            const sz = ICON_SIZES[getIconSize(currentCategory)];
            const escapedCat = escapeJsStr(currentCategory);
            const escapedParentSub = escapeJsStr(currentSubcategory || '');

            const getFolderItemCount = (folderName) => {
                if (currentSubcategory) {
                    return deviceFiltered.filter(s =>
                        (s.category || 'Geral').trim().toLowerCase() === currentCategory.trim().toLowerCase() &&
                        (s.subcategory || '').trim().toLowerCase() === currentSubcategory.trim().toLowerCase() &&
                        (s.subsubcategory || '').trim().toLowerCase() === folderName.toLowerCase()
                    ).length;
                } else {
                    return deviceFiltered.filter(s =>
                        (s.category || 'Geral').trim().toLowerCase() === currentCategory.trim().toLowerCase() &&
                        (s.subcategory || '').trim().toLowerCase() === folderName.toLowerCase()
                    ).length;
                }
            };

            const otherSubsCount = getCategorySubcategories(currentCategory).filter(s => s.trim().toLowerCase() !== (currentSubcategory || '').trim().toLowerCase()).length;

            if (viewMode === 'grid') {
                list.classList.add('hidden');
                grid.classList.remove('hidden');
                grid.className = 'grid ' + sz.cols;

                const subCardsHtml = subcategoriesToShow.map((subName, idx) => {
                    const subCount = getFolderItemCount(subName);
                    const menuId = `actionMenuSubGrid_${idx}`;
                    const escapedSub = escapeJsStr(subName);
                    const subCustom = getSubcategoryCustom(currentCategory, subName);

                    let subIconHtml = `<i class="fa-solid fa-folder text-amber-400 text-2xl"></i>`;
                    if (subCustom && subCustom.image) {
                        subIconHtml = `<img src="${subCustom.image}" class="${sz.img} object-contain">`;
                    } else if (subCustom && subCustom.icon) {
                        subIconHtml = `<i class="${subCustom.icon} text-2xl"></i>`;
                    }

                    return `
                        <div class="group relative flex flex-col items-center justify-between ${sz.cardPad} ${sz.cardMin} h-full rounded-lg cursor-pointer text-center bg-amber-50/60 border border-amber-200/80 hover:border-amber-400 hover:shadow-sm overflow-visible"
                             onclick="openSubcategory('${escapedSub}')">
                            <span class="absolute top-1 left-1.5 text-[10px] font-semibold text-amber-700 bg-amber-100/90 px-1.5 rounded-full pointer-events-none">${subCount}</span>
                            <div class="${sz.box} my-auto flex items-center justify-center pointer-events-none shrink-0">
                                ${subIconHtml}
                            </div>
                            <span class="${sz.text} text-gray-800 line-clamp-2 w-full font-semibold pointer-events-none mt-1 leading-tight">${subName}</span>
                        </div>
                    `;
                }).join('');

                const linksHtml = filtered.map((item, index) => {
                    const targetUrl = item.file || item.name;
                    const iconUrl = item.customIcon || getFaviconUrl(targetUrl);
                    const menuId = `actionMenuLinkGrid_${index}`;
                    const isFav = !!item.isFavorite;

                    return `
                        <div class="group relative flex flex-col items-center justify-between ${sz.cardPad} ${sz.cardMin} h-full rounded-lg cursor-pointer text-center bg-white border border-gray-200/80 hover:border-blue-300 hover:shadow-sm overflow-visible"
                             data-item-id="${item.id}" onclick="openShortcut('${targetUrl}', '${item.id}')">
                            <button type="button" onclick="toggleFavorite(event, '${item.id}')" class="absolute top-1 left-1 p-1 text-gray-300 hover:text-amber-400 z-10 cursor-pointer">
                                <i class="fa-solid fa-star text-xs ${isFav ? 'text-amber-400' : ''} pointer-events-none"></i>
                            </button>
                            <div class="${sz.box} my-auto flex items-center justify-center pointer-events-none shrink-0">
                                <img src="${iconUrl}" class="${sz.img} object-contain" onerror="this.src='https://via.placeholder.com/32'">
                            </div>
                            <span class="${sz.text} text-gray-700 line-clamp-2 w-full font-medium pointer-events-none mt-1 leading-tight">${item.title || item.name}</span>
                        </div>
                    `;
                }).join('');

                grid.innerHTML = subCardsHtml + linksHtml;
            } else {
                grid.classList.add('hidden');
                list.classList.remove('hidden');

                const linksListHtml = filtered.map((item, index) => {
                    const targetUrl = item.file || item.name;
                    const iconUrl = item.customIcon || getFaviconUrl(targetUrl);
                    const isFav = !!item.isFavorite;

                    return `
                        <div class="flex items-center justify-between ${sz.rowPad} hover:bg-gray-50 border-b border-gray-100 cursor-pointer transition-colors relative"
                             data-item-id="${item.id}" onclick="openShortcut('${targetUrl}', '${item.id}')">
                            <div class="flex items-center gap-3 min-w-0 flex-1 pointer-events-none">
                                <button type="button" onclick="toggleFavorite(event, '${item.id}')" class="p-1 text-gray-300 hover:text-amber-400 cursor-pointer pointer-events-auto">
                                    <i class="fa-solid fa-star text-xs ${isFav ? 'text-amber-400' : ''} pointer-events-none"></i>
                                </button>
                                <div class="${sz.lBox} flex items-center justify-center bg-gray-100 rounded shrink-0 pointer-events-none">
                                    <img src="${iconUrl}" class="${sz.lImg} object-contain pointer-events-none" onerror="this.src='https://via.placeholder.com/20'">
                                </div>
                                <div class="min-w-0 flex-1 pointer-events-none">
                                    <p class="text-xs font-medium text-gray-800 truncate pointer-events-none">${item.title || item.name}</p>
                                    <p class="text-[10px] text-gray-400 truncate pointer-events-none">${targetUrl}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                list.innerHTML = linksListHtml;
            }
        }

        function render() {
            renderCategories();
            renderGrid();
        }

        window.onload = async function() {
            await loadLocalData();
            currentCategory = getInitialCategory();
            render();
            startAutoSync();
        };
    </script>
</body>
</html>
